name = "hooplife-app"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false

# app.hooplifenba.com Cloudflare'de bu Worker'a bagli; DNS kaydini
# Cloudflare olusturur. PROXY_SECRET: `wrangler secret put PROXY_SECRET`
routes = [
  { pattern = "app.hooplifenba.com", custom_domain = true }
]
