{#- Yarim saha sut haritasi. shots: sx/sy (ayak, pota ustte), made, q, clock, text -#}
{% macro court(shots, label="Shot chart") -%}
<svg viewBox="0 0 50 36" role="img" aria-label="{{ label }}">
  <g class="court" fill="none">
    <rect x="0" y="0" width="50" height="36"/>
    <rect x="17" y="0" width="16" height="19"/>
    <circle cx="25" cy="19" r="6"/>
    <path d="M3 0 L3 14.2 A23.75 23.75 0 0 0 47 14.2 L47 0"/>
    <path d="M21 5.25 A4 4 0 0 0 29 5.25"/>
    <line x1="22" y1="4" x2="28" y2="4"/>
    <circle cx="25" cy="5.25" r=".75"/>
  </g>
  {% for s in shots %}
    {% if s.made %}<circle class="sh-made" cx="{{ s.sx }}" cy="{{ s.sy }}" r=".95"><title>Q{{ s.q }} {{ s.clock }} · {{ s.text }}</title></circle>
    {% else %}<g class="sh-miss" transform="translate({{ s.sx }} {{ s.sy }})"><title>Q{{ s.q }} {{ s.clock }} · {{ s.text }}</title><path d="M-.75 -.75 L.75 .75 M.75 -.75 L-.75 .75"/></g>{% endif %}
  {% endfor %}
</svg>
{%- endmacro %}
