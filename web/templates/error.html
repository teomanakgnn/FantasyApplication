{% extends "base.html" %}
{% block title %}{{ title }} · HoopLife NBA{% endblock %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}
{% block content %}
<div class="empty" style="margin-top:40px">
  <h1>{{ title }}</h1>
  {% if detail %}<p>{{ detail }}</p>{% endif %}
  <div class="row" style="justify-content:center;margin-top:12px">
    <a class="btn btn-primary" href="/">Go to home</a>
    <button class="btn btn-ghost" onclick="history.back()">Go back</button>
  </div>
</div>
{% endblock %}
