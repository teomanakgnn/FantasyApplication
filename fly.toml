# HoopLife NBA - Fly.io. Veritabani (Neon) Londra'da, sunucu da Londra'da.
# Sirlar (DB_*, SECRET_KEY, RESEND_API_KEY ...) burada degil: `fly secrets`.
app = "hooplife-nba"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  SITE_URL = "https://app.hooplifenba.com"

[http_service]
  internal_port = 8000
  force_https = true
  # Tek, surekli acik makine: arka plan isleri (IndexNow, mac dizini), bellekteki
  # onbellekler ve watch party sinyali uyuyan/cogalan makinede calismaz.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "120s"
    interval = "30s"
    timeout = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
